<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#153d35">
    <title>Detalhe da ocorrência | SíndicoDigital</title>
    <link rel="stylesheet" href="/auth.css">
    <link rel="stylesheet" href="/painel.css">
    <script src="/painel-comum.js" defer></script>
    <script src="/ocorrencia.js" defer></script>
  </head>
  <body>
    <main class="painel-layout">
      <section class="painel-card" aria-labelledby="page-title">
        <a class="brand" href="/painel/ocorrencias" aria-label="SíndicoDigital, ocorrências">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>SíndicoDigital</span>
        </a>

        <div class="intro">
          <p class="eyebrow">Ocorrência</p>
          <h1 id="page-title">Detalhe da ocorrência</h1>
        </div>

        <a class="voltar" href="/painel/ocorrencias">← Voltar para a lista</a>

        <div class="estado" id="estado-carregando" role="status">
          Carregando ocorrência...
        </div>

        <div class="notice notice-error" id="estado-erro" role="alert" hidden>
          <p id="erro-texto"></p>
          <button class="button button-secondary" type="button" id="tentar-novamente">
            Tentar novamente
          </button>
        </div>

        <dl class="detalhe-lista" id="detalhe" hidden>
          <div>
            <dt>Status</dt>
            <dd><span class="status" id="detalhe-status"></span></dd>
          </div>
          <div>
            <dt>Categoria</dt>
            <dd id="detalhe-categoria"></dd>
          </div>
          <div>
            <dt>Unidade</dt>
            <dd id="detalhe-unidade"></dd>
          </div>
          <div>
            <dt>Data</dt>
            <dd id="detalhe-data"></dd>
          </div>
          <div>
            <dt>Descrição</dt>
            <dd class="detalhe-descricao" id="detalhe-descricao"></dd>
          </div>
        </dl>
      </section>
    </main>
  </body>
</html>
