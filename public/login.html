<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#153d35">
    <title>Entrar | SíndicoDigital</title>
    <link rel="stylesheet" href="/auth.css">
    <script src="/login.js" defer></script>
  </head>
  <body>
    <main class="auth-layout">
      <section class="auth-card" aria-labelledby="page-title">
        <a class="brand" href="/" aria-label="SíndicoDigital, início">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span>SíndicoDigital</span>
        </a>

        <div class="intro">
          <p class="eyebrow">Bem-vindo de volta</p>
          <h1 id="page-title">Acesse sua conta</h1>
          <p>Entre com o e-mail e a senha usados no cadastro.</p>
        </div>

        <div class="notice notice-success" id="signup-success" role="status" hidden>
          Cadastro realizado com sucesso. Agora você já pode entrar. Se sua conta
          estiver sem unidade vinculada, solicite o vínculo à administração do
          condomínio.
        </div>

        <div class="notice notice-error" id="form-message" role="alert" hidden></div>

        <form id="login-form" novalidate>
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            required
          >

          <label for="senha">Senha</label>
          <input
            id="senha"
            name="senha"
            type="password"
            autocomplete="current-password"
            required
          >

          <button class="button" type="submit" id="submit-button">Entrar</button>
        </form>

        <p class="form-footer">
          Ainda não tem conta? <a href="/cadastro">Cadastre-se</a>
        </p>
      </section>
    </main>
  </body>
</html>
